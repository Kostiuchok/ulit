name: E2E Sprint 3

# Hits the deployed site and publishes a real book (prefix "E2E ").
# Not on every push to main — the smoke job in ci.yml already runs there
# with continue-on-error, and it ignores e2e/sprint3.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    branches: [main, dev]

jobs:
  e2e:
    name: Sprint 3 E2E
    # workflow_dispatch always. On a PR, only when the run-e2e label is set
    # (opened/synchronize re-check the label so a labeled PR keeps running).
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Sprint 3 E2E
        run: pnpm test:e2e:sprint3
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://ulit.render.ua' }}
          # Author account (already a repository secret): e2e@render.ua
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          # Admin approve/reject skips when these are unset. Add them as
          # repository secrets or the catalog assertions never run.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
