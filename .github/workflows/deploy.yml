name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d ' \n\r\t' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "|1|ano1+rHtFVv9g5TfVIKIOCIbG0k=|l9QN9/SabWN4kvBKi4PP15UZKRY= ssh-rsa " >> ~/.ssh/known_hosts
          echo "|1|86yw1G0dVBodWoL32+8XPcPQwDQ=|4033hKbN+QouwI43DWrMhEV8W3o= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBRqoECRSm3VdABQW9IwT3O1wVj6swqwSFpe2jg7fW0J" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: ssh -i ~/.ssh/deploy_key -p 22 root@${{ vars.SSH_HOST }} "bash /opt/knyha-platform/infra/scripts/deploy.sh"
        timeout-minutes: 20

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # After the deploy, against the code that is now live. A red result here
    # means the live site misbehaves -- it does not undo the deploy.
    needs: deploy
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch; pin to what was deployed.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://ulit.render.ua' }}
          # Authenticated-flow tests skip themselves when these are unset --
          # see e2e/auth-publish.spec.ts for why a fresh registration can't
          # be used (email verification is required before login).
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
