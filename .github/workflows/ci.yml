name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  ci:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api exec prisma generate

      - run: pnpm lint
        continue-on-error: true

      - run: pnpm typecheck

      # next build runs its own ESLint pass (react/no-unescaped-entities etc.)
      # that neither `tsc --noEmit` nor `next lint` alone reproduces -- and
      # it's the exact command deploy.sh runs on the VPS. Without this step,
      # a build-breaking commit passes CI green and only fails at deploy
      # time, silently blocking api+worker too (see CLAUDE.md journal #13).
      - name: Build web (real production build, not just typecheck)
        run: pnpm --filter web build

      - name: Unit tests (API)
        run: pnpm --filter api test
