name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  ci:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api exec prisma generate

      - run: pnpm lint
        continue-on-error: true

      - run: pnpm typecheck

      # next build runs its own ESLint pass (react/no-unescaped-entities etc.)
      # that neither `tsc --noEmit` nor `next lint` alone reproduces -- and
      # it's the exact command deploy.sh runs on the VPS. Without this step,
      # a build-breaking commit passes CI green and only fails at deploy
      # time, silently blocking api+worker too (see CLAUDE.md journal #13).
      - name: Build web (real production build, not just typecheck)
        run: pnpm --filter web build

      - name: Unit tests (API)
        run: pnpm --filter api test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://ulit.render.ua' }}
          # Authenticated-flow tests skip themselves when these are unset --
          # see e2e/auth-publish.spec.ts for why a fresh registration can't
          # be used (email verification is required before login).
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
